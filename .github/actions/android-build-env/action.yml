name: Android build environment
description: >-
  Everything a job needs between its checkout and its first Gradle call: JDK 25, the Android SDK
  licences and paths (and no SDK packages), a validated Gradle wrapper, and setup-gradle with the
  cache mode the caller names. One place for these pins instead of six.

inputs:
  cache-mode:
    description: >-
      How setup-gradle treats its cache. `write-on-main` restores everywhere and writes only on a
      push to refs/heads/main; `read-only` restores and never writes; `disabled` neither restores
      nor writes (the release and its dry run); `skip` does not run setup-gradle at all, for a job
      whose Gradle step sets itself up (dependency-submission).
    required: true

runs:
  using: composite
  steps:
    - name: Check the cache mode
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.cache-mode }}
      run: |
        set -euo pipefail
        case "$CACHE_MODE" in
          write-on-main|read-only|disabled|skip) echo "Gradle cache mode: $CACHE_MODE" ;;
          *)
            echo "::error::cache-mode must be write-on-main, read-only, disabled or skip; got '$CACHE_MODE'"
            exit 1
            ;;
        esac

    - name: Set up JDK 25 (Temurin)
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '25'

    - name: Set up the Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      with:
        packages: ''

    - name: Validate the Gradle wrapper
      uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb

    - name: Set up Gradle
      if: inputs.cache-mode != 'skip'
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      with:
        cache-disabled: ${{ inputs.cache-mode == 'disabled' }}
        cache-read-only: ${{ inputs.cache-mode == 'read-only' || (inputs.cache-mode == 'write-on-main' && github.ref != 'refs/heads/main') }}
