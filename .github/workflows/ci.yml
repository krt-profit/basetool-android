name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up the Android build environment
        uses: $/.github/actions/android-build-env
        with:
          cache-mode: write-on-main

      - name: Build, test and lint
        run: ./gradlew build --continue --stacktrace

      - name: Collect the Android Lint SARIF report
        id: lint_sarif
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/sarif
          found=0
          while IFS= read -r report; do
            cp "$report" "build/sarif/$(basename "$report")"
            found=$((found + 1))
          done < <(find ./app -path '*/build/reports/lint-results-*.sarif' -type f)
          echo "collected $found lint SARIF report(s)"
          echo "count=$found" >> "$GITHUB_OUTPUT"

      - name: Upload Android Lint results to code scanning
        if: >-
          always() &&
          steps.lint_sarif.outputs.count != '0' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          sarif_file: build/sarif
          category: android-lint

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload static-analysis reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analysis-reports
          path: |
            **/build/reports/lint-results-*.*
            **/build/reports/detekt/**
          retention-days: 14
          if-no-files-found: ignore

  dependency-graph:
    name: Submit the dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up the Android build environment
        uses: $/.github/actions/android-build-env
        with:
          cache-mode: skip

      - name: Submit the resolved dependencies
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl -fsSL "$url" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Run actionlint
        run: actionlint -color -ignore 'specifying action "\$/[^"]+" in invalid format because ref is missing'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install zizmor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes -r .github/requirements/zizmor.txt
          zizmor --version

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=regular --format=plain .github/workflows .github/actions
