name: Release

# Builds, signs, attests and publishes the APK for a `v*` tag.
#
# The dry run (`release-dry-run.yml`) rehearses the signing path on every pull request with a
# throwaway key. This is the real thing: the `release` environment's key, a published artifact, and
# the two numbers a member needs to check what they installed.
#
# ── What a reader can verify afterwards, and why each piece is here ──────────────────────────────
#
# Distribution is GitHub Releases plus Obtainium (plan Q1). There is no store review, no Play App
# Signing and no channel that can pull a bad build back — so everything that would normally be
# somebody else's check has to be produced here and published beside the file:
#
#   * an **artifact attestation** (`actions/attest-build-provenance`), which binds this APK to this
#     workflow, this commit and this runner. `gh attestation verify` checks it offline against the
#     repository, so "I downloaded an APK from a link" becomes "I downloaded the APK this tag
#     built".
#   * the **APK's SHA-256**, in the release notes. It is what somebody compares after an Obtainium
#     update, and it is the only check available to a member who will not install the GitHub CLI.
#   * the **signing certificate's SHA-256**, also in the notes and in the README. Android refuses an
#     update signed by a different key, so a changed fingerprint is either a rotation the owner
#     performed or an APK that did not come from us. Publishing it is what makes that distinction
#     checkable rather than a matter of trust.
#
# ── The parts that are deliberately awkward ─────────────────────────────────────────────────────
#
# No Gradle cache. A poisoned cache entry would become a poisoned artifact, and a signed one — the
# same reasoning as the dry run, which pays for a cold build for exactly this reason (DEV_CI § 4).
#
# The keystore is shredded in an `always()` step. Key material must not survive a failed run on a
# runner, and the habit matters more than the individual case.
#
# The release is created as a **draft**. The owner publishes it after reading the notes and, if they
# want, installing the APK — a tag push should not be able to hand every member a build nobody
# looked at.
#
# The tag is the ref this run was started on, and nothing else. A manual re-run is dispatched ON the
# tag (`gh workflow run release.yml --ref v0.3.1`); there is no free-text `tag` input any more. The
# old input let a dispatch name one tag while the run's ref — the one the `release` environment's
# tag rule judges — was another, and its value went into the checkout ref and the release name. The
# first step now refuses any ref that is not a `vMAJOR.MINOR.PATCH` tag, and
# `gh release create --verify-tag` refuses to invent a tag that does not exist (audit SIB-SEC-06,
# 2026-09-22).
#
# No secret is ever expanded into a script. Each reaches its step through `env:` and is read as a
# variable, and the keystore password goes to keytool as `-storepass:env`, never as an argument —
# argv is readable by every process on the runner (audit SIB-SEC-07, 2026-09-22). The dry run uses
# the same shapes with its throwaway key, so a mistake here is caught on a pull request first.

on:
  push:
    tags: ['v*']
  # Dispatch on the tag itself: `gh workflow run release.yml --ref v0.3.1`. See the header.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Tag-restricted, with a required reviewer. The signing secrets live here and nowhere else
    # (DEV_CI § 4), so a workflow on a branch cannot reach them however it is triggered.
    environment: release

    permissions:
      contents: write
      # Both are what `attest-build-provenance` needs to mint and store the attestation.
      id-token: write
      attestations: write

    env:
      # The APK's own floor. `apksigner verify` judges an APK against an SDK range, and the range
      # that matters is the one the app actually installs on (ADR-0015; this said 30 until
      # 2026-09-22, a floor the app left on 2026-08-27).
      APP_MIN_SDK: '31'

    steps:
      # Before anything is checked out or built: the ref must be a release tag of the one shape
      # this repository cuts. `github.ref_name` is a tag name the runner reports, not something a
      # dispatcher typed, and it is passed through `env` rather than expanded into the script.
      - name: Check the release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::a release runs on a tag; this run was started on a $REF_TYPE. Dispatch it with --ref vX.Y.Z."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag of the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "releasing $TAG"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `disabled`: see the header — a signed artifact must not be able to inherit a poisoned cache
      # entry.
      - name: Set up the Android build environment
        uses: ./.github/actions/android-build-env
        with:
          cache-mode: disabled

      - name: Decode the signing keystore
        env:
          KRT_SIGNING_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.p12"
          printf '%s' "$KRT_SIGNING_KEYSTORE_BASE64" | base64 -d > "$keystore"
          # A silently truncated secret decodes fine and fails much later with an error that reads
          # like a corrupt key rather than a broken transport. PKCS#12 starts with an ASN.1
          # SEQUENCE, so a two-byte look is enough to tell the two apart here.
          if [ ! -s "$keystore" ] || [ "$(head -c 2 "$keystore" | xxd -p)" != "3082" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 did not decode to a PKCS#12 keystore."
            exit 1
          fi
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Read the signing certificate's fingerprint
        id: cert
        env:
          KRT_SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KRT_SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # `:env` makes keytool read the password from the named variable; passed as a plain
          # argument it would sit in the process's argv for as long as keytool runs.
          fingerprint="$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" -storetype PKCS12 \
            -storepass:env KRT_SIGNING_STORE_PASSWORD \
            -alias "$KRT_SIGNING_KEY_ALIAS" \
            | grep -oP 'SHA256:\s*\K[0-9A-Fa-f:]+' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build the signed release APK
        env:
          KRT_SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KRT_SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KRT_SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KRT_SIGNING_KEYSTORE="$KEYSTORE_PATH" \
            ./gradlew :app:assembleProdRelease --stacktrace

      - name: Verify the signature
        id: verify
        env:
          EXPECTED_FINGERPRINT: ${{ steps.cert.outputs.fingerprint }}
        run: |
          set -euo pipefail

          # The file name is half the assertion: with the signing config not taking effect AGP
          # writes app-prod-release-UNSIGNED.apk and the build still succeeds.
          apk="app/build/outputs/apk/prod/release/app-prod-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::no signed APK was produced; the build wrote:"
            ls -l app/build/outputs/apk/prod/release/
            exit 1
          fi

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"

          report="$("$apksigner" verify --verbose --print-certs \
            --min-sdk-version "$APP_MIN_SDK" "$apk")"
          echo "$report"

          fail=0
          check() {
            if printf '%s' "$report" | grep -qF "$1"; then
              echo "  ok      $2"
            else
              echo "::error::$2 — not true of this APK. $3"
              fail=1
            fi
          }

          check "Verifies" \
            "the APK verifies at minSdk $APP_MIN_SDK" \
            "It would not install."
          check "Verified using v3 scheme (APK Signature Scheme v3): true" \
            "the APK carries a v3 signature" \
            "Without one, no key rotation can ever be proven to Android."
          check "Verified using v1 scheme (JAR signing): false" \
            "v1 (JAR) signing is off" \
            "minSdk $APP_MIN_SDK never uses it, and it is the scheme Janus attacks."
          check "Number of signers: 1" \
            "the APK has exactly one signer" \
            "A second signer is not something this build should produce."
          # The assertion that catches a signing config which silently did nothing: an APK signed
          # by the debug keystore also "verifies", and its certificate is not this one. Matched on
          # the digest alone, because the label around it is a build-tools detail that has changed.
          check "certificate SHA-256 digest: $EXPECTED_FINGERPRINT" \
            "the certificate is the release key" \
            "The signing config did not take effect, or a different key was used."
          test "$fail" -eq 0

          # Named after the tag so a downloaded file says which release it is. Obtainium reads the
          # release, not the file name, but a member's Downloads folder does not.
          version="${GITHUB_REF_NAME#refs/tags/}"
          out="basetool-${version}.apk"
          cp "$apk" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Shred the keystore
        # `always()`: a failed build must not leave key material on a runner.
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_PATH:-}" ] && [ -f "$KEYSTORE_PATH" ]; then
            shred -u "$KEYSTORE_PATH"
            echo "shredded $KEYSTORE_PATH"
          fi

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.verify.outputs.apk }}

      - name: Export the dependency SBOM
        id: sbom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's own dependency-graph export rather than the CycloneDX Gradle plugin, which
          # DEV_CI § 4 leaves conditional on an AGP compatibility nobody has verified. This needs
          # no plugin, cannot break the build, and describes the same resolved graph -- the
          # `dependency-submission` step on main is what keeps it current.
          #
          # A repository whose graph has never been submitted answers with an almost empty
          # document rather than an error, so the job does not fail on it: an SBOM is evidence to
          # publish, not a gate on shipping a build that is already signed and attested.
          #
          # `--jq .sbom` unwraps the API envelope. The endpoint answers {"sbom": {...}}, so the
          # raw body is a GitHub response that happens to contain an SBOM, not a document an SPDX
          # tool can open. The name says the format for the same reason: a consumer should not
          # have to sniff the file to learn it is SPDX 2.3 and not CycloneDX.
          SBOM="basetool-android-sbom.spdx.json"
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" --jq '.sbom' \
              > "$SBOM" 2>/dev/null && [ -s "$SBOM" ] && [ "$(head -c 1 "$SBOM")" = "{" ]; then
            echo "path=$SBOM" >> "$GITHUB_OUTPUT"
            echo "SBOM exported ($(wc -c < "$SBOM") bytes)"
          else
            echo "::warning::the dependency graph answered no SBOM; the release ships without one"
            rm -f "$SBOM"
          fi

      # The SBOM is attested for the same reason the APK is: published without provenance it is a
      # bare file behind a URL, and a consumer cannot tell a real one from a flattering one. The
      # main repo closed exactly this gap for its four SBOM assets (ADR-0145 / REQ-OPS-023);
      # attaching this one without provenance would re-open it here.
      - name: Attest the SBOM provenance
        if: steps.sbom.outputs.path != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.sbom.outputs.path }}

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.verify.outputs.apk }}
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
          CERT_SHA256: ${{ steps.cert.outputs.fingerprint }}
          SBOM: ${{ steps.sbom.outputs.path }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Installation

          **DE** — Über [Obtainium](https://github.com/ImranR98/Obtainium) mit dieser
          Repository-URL, oder die APK unten direkt herunterladen. Es gibt keinen
          Play-Store-Eintrag.

          **EN** — Through [Obtainium](https://github.com/ImranR98/Obtainium) with this
          repository URL, or download the APK below. There is no Play Store listing.

          ## Prüfsummen · Checksums

          | Wert · Value | SHA-256 |
          |---|---|
          | APK | \`$APK_SHA256\` |
          | Signaturzertifikat · Signing certificate | \`$CERT_SHA256\` |

          **DE** — Beide Werte lassen sich vor dem Installieren vergleichen. Der
          Zertifikats-Fingerabdruck ändert sich **nie** ohne einen angekündigten
          Schlüsselwechsel; ein anderer Wert bedeutet, dass die Datei nicht von uns stammt —
          Android verweigert dann ohnehin das Update über eine bestehende Installation.
          Den unabhängigen Vergleichswert findest du in der
          [README](https://github.com/${{ github.repository }}#readme): er wurde beim Erzeugen
          des Schlüssels festgehalten, also bevor er irgendetwas signiert hat.

          **EN** — Both values can be checked before installing. The certificate fingerprint
          **never** changes without an announced key rotation; a different value means the file
          is not ours, and Android would refuse the update over an existing install anyway. The
          independent reference lives in the
          [README](https://github.com/${{ github.repository }}#readme) — it was recorded when
          the key was generated, before it had signed anything.

          ## Herkunft · Provenance

          **DE** — Dieses Release trägt eine GitHub-Build-Attestierung: sie belegt, dass genau
          dieser Workflow auf genau diesem Commit die Datei erzeugt hat.

          **EN** — This release carries a GitHub build attestation: proof that this workflow, on
          this commit, produced the file.

          \`\`\`bash
          gh attestation verify $APK --repo ${{ github.repository }}
          \`\`\`
          EOF

          if [ -n "${SBOM:-}" ]; then
            cat >> notes.md <<EOF

          ## Stückliste · SBOM

          **DE** — \`$SBOM\` listet jede Abhängigkeit, die in dieser APK steckt (SPDX 2.3). Sie
          trägt dieselbe Build-Attestierung wie die APK, ist also nicht nur eine Datei neben dem
          Release, sondern nachweislich in diesem Lauf entstanden.

          **EN** — \`$SBOM\` lists every dependency that went into this APK (SPDX 2.3). It carries
          the same build attestation as the APK, so it is verifiably a product of this run rather
          than a file that merely sits next to the release.

          \`\`\`bash
          gh attestation verify $SBOM --repo ${{ github.repository }}
          \`\`\`
          EOF
          fi

          # Built as an array so a missing SBOM drops the argument entirely rather than passing an
          # empty string, which gh reads as an asset path and rejects.
          assets=("$APK")
          if [ -n "${SBOM:-}" ]; then
            assets+=("$SBOM")
          fi

          # --verify-tag: the release attaches to the tag this run built; gh refuses rather than
          # creating a new tag on the default branch when that tag is not on the remote.
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --notes-file notes.md
