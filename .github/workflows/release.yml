name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment: release

    permissions:
      contents: write
      id-token: write
      attestations: write

    env:
      APP_MIN_SDK: '31'

    steps:
      - name: Check the release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::a release runs on a tag; this run was started on a $REF_TYPE. Dispatch it with --ref vX.Y.Z."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag of the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "releasing $TAG"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up the Android build environment
        uses: $/.github/actions/android-build-env
        with:
          cache-mode: disabled

      - name: Decode the signing keystore
        env:
          KRT_SIGNING_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.p12"
          printf '%s' "$KRT_SIGNING_KEYSTORE_BASE64" | base64 -d > "$keystore"
          if [ ! -s "$keystore" ] || [ "$(head -c 2 "$keystore" | xxd -p)" != "3082" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 did not decode to a PKCS#12 keystore."
            exit 1
          fi
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Read the signing certificate's fingerprint
        id: cert
        env:
          KRT_SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KRT_SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          fingerprint="$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" -storetype PKCS12 \
            -storepass:env KRT_SIGNING_STORE_PASSWORD \
            -alias "$KRT_SIGNING_KEY_ALIAS" \
            | grep -oP 'SHA256:\s*\K[0-9A-Fa-f:]+' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build the signed release APK
        env:
          KRT_SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KRT_SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KRT_SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KRT_SIGNING_KEYSTORE="$KEYSTORE_PATH" \
            ./gradlew :app:assembleProdRelease --stacktrace

      - name: Verify the signature
        id: verify
        env:
          EXPECTED_FINGERPRINT: ${{ steps.cert.outputs.fingerprint }}
        run: |
          set -euo pipefail

          apk="app/build/outputs/apk/prod/release/app-prod-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::no signed APK was produced; the build wrote:"
            ls -l app/build/outputs/apk/prod/release/
            exit 1
          fi

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"

          report="$("$apksigner" verify --verbose --print-certs \
            --min-sdk-version "$APP_MIN_SDK" "$apk")"
          echo "$report"

          fail=0
          check() {
            if printf '%s' "$report" | grep -qF "$1"; then
              echo "  ok      $2"
            else
              echo "::error::$2 — not true of this APK. $3"
              fail=1
            fi
          }

          check "Verifies" \
            "the APK verifies at minSdk $APP_MIN_SDK" \
            "It would not install."
          check "Verified using v3 scheme (APK Signature Scheme v3): true" \
            "the APK carries a v3 signature" \
            "Without one, no key rotation can ever be proven to Android."
          check "Verified using v1 scheme (JAR signing): false" \
            "v1 (JAR) signing is off" \
            "minSdk $APP_MIN_SDK never uses it, and it is the scheme Janus attacks."
          check "Number of signers: 1" \
            "the APK has exactly one signer" \
            "A second signer is not something this build should produce."
          check "certificate SHA-256 digest: $EXPECTED_FINGERPRINT" \
            "the certificate is the release key" \
            "The signing config did not take effect, or a different key was used."
          test "$fail" -eq 0

          version="${GITHUB_REF_NAME#refs/tags/}"
          out="basetool-${version}.apk"
          cp "$apk" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Shred the keystore
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_PATH:-}" ] && [ -f "$KEYSTORE_PATH" ]; then
            shred -u "$KEYSTORE_PATH"
            echo "shredded $KEYSTORE_PATH"
          fi

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ steps.verify.outputs.apk }}

      - name: Export the dependency SBOM
        id: sbom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SBOM="basetool-android-sbom.spdx.json"
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" --jq '.sbom' \
              > "$SBOM" 2>/dev/null && [ -s "$SBOM" ] && [ "$(head -c 1 "$SBOM")" = "{" ]; then
            echo "path=$SBOM" >> "$GITHUB_OUTPUT"
            echo "SBOM exported ($(wc -c < "$SBOM") bytes)"
          else
            echo "::warning::the dependency graph answered no SBOM; the release ships without one"
            rm -f "$SBOM"
          fi

      - name: Attest the SBOM provenance
        if: steps.sbom.outputs.path != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ steps.sbom.outputs.path }}

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.verify.outputs.apk }}
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
          CERT_SHA256: ${{ steps.cert.outputs.fingerprint }}
          SBOM: ${{ steps.sbom.outputs.path }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Installation

          **DE** — Über [Obtainium](https://github.com/ImranR98/Obtainium) mit dieser
          Repository-URL, oder die APK unten direkt herunterladen. Es gibt keinen
          Play-Store-Eintrag.

          **EN** — Through [Obtainium](https://github.com/ImranR98/Obtainium) with this
          repository URL, or download the APK below. There is no Play Store listing.

          ## Prüfsummen · Checksums

          | Wert · Value | SHA-256 |
          |---|---|
          | APK | \`$APK_SHA256\` |
          | Signaturzertifikat · Signing certificate | \`$CERT_SHA256\` |

          **DE** — Beide Werte lassen sich vor dem Installieren vergleichen. Der
          Zertifikats-Fingerabdruck ändert sich **nie** ohne einen angekündigten
          Schlüsselwechsel; ein anderer Wert bedeutet, dass die Datei nicht von uns stammt —
          Android verweigert dann ohnehin das Update über eine bestehende Installation.
          Den unabhängigen Vergleichswert findest du in der
          [README](https://github.com/${{ github.repository }}#readme): er wurde beim Erzeugen
          des Schlüssels festgehalten, also bevor er irgendetwas signiert hat.

          **EN** — Both values can be checked before installing. The certificate fingerprint
          **never** changes without an announced key rotation; a different value means the file
          is not ours, and Android would refuse the update over an existing install anyway. The
          independent reference lives in the
          [README](https://github.com/${{ github.repository }}#readme) — it was recorded when
          the key was generated, before it had signed anything.

          ## Herkunft · Provenance

          **DE** — Dieses Release trägt eine GitHub-Build-Attestierung: sie belegt, dass genau
          dieser Workflow auf genau diesem Commit die Datei erzeugt hat.

          **EN** — This release carries a GitHub build attestation: proof that this workflow, on
          this commit, produced the file.

          \`\`\`bash
          gh attestation verify $APK --repo ${{ github.repository }}
          \`\`\`
          EOF

          if [ -n "${SBOM:-}" ]; then
            cat >> notes.md <<EOF

          ## Stückliste · SBOM

          **DE** — \`$SBOM\` listet jede Abhängigkeit, die in dieser APK steckt (SPDX 2.3). Sie
          trägt dieselbe Build-Attestierung wie die APK, ist also nicht nur eine Datei neben dem
          Release, sondern nachweislich in diesem Lauf entstanden.

          **EN** — \`$SBOM\` lists every dependency that went into this APK (SPDX 2.3). It carries
          the same build attestation as the APK, so it is verifiably a product of this run rather
          than a file that merely sits next to the release.

          \`\`\`bash
          gh attestation verify $SBOM --repo ${{ github.repository }}
          \`\`\`
          EOF
          fi

          assets=("$APK")
          if [ -n "${SBOM:-}" ]; then
            assets+=("$SBOM")
          fi

          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --notes-file notes.md
