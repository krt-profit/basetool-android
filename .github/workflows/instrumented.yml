name: Instrumented tests

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/androidTest/**'
      - '.github/workflows/instrumented.yml'
      - '.github/actions/android-build-env/**'

concurrency:
  group: instrumented-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented tests (API 31)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up the Android build environment
        uses: $/.github/actions/android-build-env
        with:
          cache-mode: read-only

      - name: Give the runner user access to KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run the instrumented tests on the managed device
        run: >-
          ./gradlew :app:api31DevDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.notClass=de.greluc.krt.profit.basetool.android.TestStackTlsHandshakeTest
          --stacktrace

      - name: Upload the instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 14
          if-no-files-found: ignore
