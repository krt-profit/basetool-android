name: Instrumented tests

# Runs the androidTest suite on an emulator: the three tests in `app/src/androidTest/` exist for
# properties the JVM and Robolectric cannot see at all, and until this workflow they ran only when
# somebody remembered to start an emulator by hand.
#
#   * ApiReaderMainThreadTest       — StrictMode is a runtime facility; the main-thread crash of
#                                     REQ-APP-API-008 shipped past a green JVM suite.
#   * AppLockKeystoreContractTest   — the app lock's Keystore contract needs a real Keystore; two
#                                     defects that made the lock unusable on a whole platform range
#                                     were invisible off a device (ADR-0006).
#   * TestStackTlsHandshakeTest     — needs the main repository's test stack, which this job does
#                                     not start. It reports itself SKIPPED here, by design (its
#                                     KDoc: a red bar for "the stack is not running" teaches people
#                                     to ignore red bars). It stays a local, by-hand test.
#
# ── How ────────────────────────────────────────────────────────────────────────────────────────
#
# Gradle Managed Devices (`atdApi31` in app/build.gradle.kts): the emulator, its system image and
# its lifecycle are Gradle's, so the command a developer runs locally is the command CI runs —
# `./gradlew :app:atdApi31DevDebugAndroidTest`. `aosp-atd` is the Automated Test Device image,
# stripped of Play services and the launcher, and API 31 is the minSdk floor (ADR-0015).
#
# GitHub's `ubuntu-latest` runners have /dev/kvm, but not readable by the runner user; the udev
# rule below opens it, which is what makes the emulator hardware-accelerated instead of unusably
# slow. `swiftshader` renders on the CPU, because the runner has no GPU.
#
# ── When ───────────────────────────────────────────────────────────────────────────────────────
#
# Nightly, on dispatch, and on a pull request that changes the instrumented tests, the managed
# device's workflow, or the build-environment action it runs on. Not on every pull request: an
# emulator boot costs minutes the ordinary gate should not pay, and none of the three tests
# watches code that changes often. This is NOT a required check.
#
# The owner approved "label-triggered + nightly" (improvement audit 2026-09, SIB-CI-01). The
# repository has no label that fits and this change creates none, so the label trigger is
# replaced by the path filter below until one exists; adding it is
# `types: [labeled]` + `if: contains(github.event.pull_request.labels.*.name, '<label>')`.

on:
  schedule:
    # Nightly, clear of the weekly CodeQL (Wed 05:23) and the daily Scorecard runs.
    - cron: '41 2 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/androidTest/**'
      - '.github/workflows/instrumented.yml'
      - '.github/actions/android-build-env/**'

concurrency:
  group: instrumented-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented tests (API 31, ATD)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `read-only`: this job restores the dependency cache and never writes one — a scheduled
      # run is on main, but nothing it produces is worth caching for the gate.
      - name: Set up the Android build environment
        uses: ./.github/actions/android-build-env
        with:
          cache-mode: read-only

      - name: Give the runner user access to KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # AGP downloads the emulator and the aosp-atd system image itself on the first run; the SDK
      # licences were accepted by the build-environment action.
      - name: Run the instrumented tests on the managed device
        run: >-
          ./gradlew :app:atdApi31DevDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace

      - name: Upload the instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 14
          if-no-files-found: ignore
