name: CodeQL

# Semantic SAST for the app's own Kotlin, plus GitHub's `actions` pack for the
# workflows in this directory. It closes the gap left by the other gates:
# detekt reports local code smells and Android Lint reports platform misuse,
# but neither follows data across call boundaries. In an app whose whole job is
# moving tokens and member data between a Keystore, a realm and an API, the
# taint-tracking is the point.
#
# **Kotlin needs a real build.** `build-mode: none` was tried first and produced
# "CodeQL could not process any code written in Java/Kotlin": buildless analysis
# does not extract Kotlin, and in a repository with no `.java` file at all that
# means an empty database rather than a partial one. The extractor hooks the
# Kotlin compiler, so the compiler has to actually run — which also means the
# Gradle build cache must be off for this job, or a restored task output would
# skip compilation and produce the same empty database with a green build.
#
# The `actions` pack needs no build and stays on `none`.
#
# **The extractor also caps the repository's Kotlin version — ADR-0022.** Because it hooks the
# compiler, the Kotlin versions CodeQL can analyse are exactly the ones its extractor was built
# against, listed in `java/kotlin-extractor/versions.bzl` in github/codeql. Building above that
# ceiling does not degrade the scan, it fails this job at the Gradle step:
#
#     com.semmle.extractor.java.interceptors.KotlinInterceptor$KotlinVersionTooRecentError:
#     Kotlin version 2.4.20 is too recent. CodeQL currently supports versions below 2.4.20
#
# That is what merging Dependabot #157 did on 2026-09-11, and `Analyze (java-kotlin)` is a required
# check, so it blocked every PR until 2026-09-13. `gradle/libs.versions.toml` therefore holds
# `kotlin` one release back, and `.github/dependabot.yml` ignores the bump. **Bumping the
# codeql-action pin below and raising that Kotlin version are one change, in this order** — the
# catalog comment carries the `gh api` one-liner that reads the extractor's current ceiling.
#
# The pin below moved to v4.38.0 (default bundle 2.27.0) on 2026-09-14 — Dependabot #164 and #165 —
# and to v4.38.1 on 2026-09-21. Neither is step 2 of that change: `versions.bzl` was re-read on both
# days and still ends at 2.4.0, `codeql-cli/v2.27.0` is still the newest CLI release (so v4.38.1's
# default bundle is the same 2.27.0), and the runner's toolcache served 2.27.0 under the old pin
# anyway. The Kotlin hold and the Dependabot ignore stay.
#
# **All four `github/codeql-action/*` call sites move in one commit** — `init` and `analyze` here,
# `upload-sarif` in `ci.yml` and `supply-chain.yml`. `analyze` reads the config `init` wrote and
# refuses a different version of it:
#
#     Loaded a configuration file for version '4.38.0', but running version '4.38.1'
#
# Dependabot proposes one PR per action *path*, so left alone it opens two halves that each fail
# this way (#174 and #175 on 2026-09-21, both closed for this commit). `.github/dependabot.yml`
# groups them so the proposal arrives whole; the group's comment carries this reason.
#
# Blocking is enforced via branch protection: mark the two matrix check names
# ("CodeQL / Analyze (java-kotlin)" and "CodeQL / Analyze (actions)") as
# required AFTER the first run on main, so GitHub knows the names.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, offset from the supply-chain workflow's Monday run.
    - cron: '23 5 * * 3'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Temurin)
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # `packages` defaults to `tools platform-tools`, and the deprecated
      # `tools` meta-package drags in the ~500 MB Android Emulator that no job
      # here uses — there is no instrumented-test job anywhere in this
      # directory, and that download has already died mid-stream ("Premature
      # EOF") and reddened an otherwise green run. The runner image already
      # ships platform-tools, the android-37 platform and build-tools 37.0.0,
      # so an empty list installs nothing while the action still accepts the
      # SDK licences and exports ANDROID_HOME / ANDROID_SDK_ROOT.
      - name: Set up the Android SDK
        if: matrix.build-mode == 'manual'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      # Every other workflow that runs the wrapper validates it first; this one
      # executes the same jar to build the CodeQL database, so it does too.
      - name: Validate the Gradle wrapper
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # No cache at all here. A restored task output would make the compile
          # tasks up-to-date, the Kotlin compiler would never run, and CodeQL
          # would build an empty database — green, and analysing nothing.
          cache-disabled: true

      # One query of the security-and-quality suite is filtered out; the config file says which
      # and why. It has to be named here — a file at that path is not auto-discovered in advanced
      # setup, and deleting this input leaves the filter silently off while the run stays green.
      #
      # `queries:` and the file's `query-filters:` do not fight each other. The action's `queries`
      # input replaces only the config file's own `queries` key — which is what the documented `+`
      # prefix opts out of — while every other key of the user config is copied through untouched.
      # So no `+` is needed, and the file declares no queries of its own. Both matrix legs share
      # the file harmlessly: a `java/…` id matches nothing in the `actions` pack.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # One debug variant is enough: every module's Kotlin is compiled by it, and
      # the release variants add R8 output CodeQL has no use for.
      - name: Build for extraction
        if: matrix.build-mode == 'manual'
        run: ./gradlew assembleDevDebug --no-build-cache --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
