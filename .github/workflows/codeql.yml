name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 3'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up the Android build environment
        if: matrix.build-mode == 'manual'
        uses: $/.github/actions/android-build-env
        with:
          cache-mode: read-only

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build for extraction
        if: matrix.build-mode == 'manual'
        run: ./gradlew assembleDevDebug --no-build-cache --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: ${{ runner.temp }}/codeql-sarif

      - name: Assert that Kotlin was extracted
        if: matrix.build-mode == 'manual'
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-sarif
          DB_DIR: ${{ runner.temp }}/codeql_databases
        run: |
          set -euo pipefail
          pattern='src/(main|dev)/kotlin/.*\.kt$'
          expected="$(git ls-files | grep -cE "$pattern" || true)"

          from_sarif=0
          sarif="$(find "$SARIF_DIR" -name '*.sarif' 2>/dev/null | head -1 || true)"
          if [ -n "$sarif" ]; then
            from_sarif="$(jq -r '
              [ .runs[].invocations[]?.toolExecutionNotifications[]?
                | select((.descriptor.id // "") | endswith("successfully-extracted-files"))
                | .locations[]?.physicalLocation.artifactLocation.uri ]
              | unique | .[]' "$sarif" | grep -cE "$pattern" || true)"
          fi

          from_archive=0
          archive="$(find "$DB_DIR" -maxdepth 2 -name src.zip 2>/dev/null | head -1 || true)"
          if [ -n "$archive" ]; then
            from_archive="$(unzip -Z1 "$archive" | grep -cE "$pattern" || true)"
          fi

          extracted=$(( from_sarif > from_archive ? from_sarif : from_archive ))
          echo "Kotlin files the build compiles:         $expected"
          echo "extracted, per the SARIF diagnostics:    $from_sarif (${sarif:-no SARIF found})"
          echo "extracted, per the database's archive:   $from_archive (${archive:-no src.zip found})"

          if [ "$extracted" -eq 0 ]; then
            echo "::error::CodeQL extracted no Kotlin. The database is empty, so the analysis would report no alerts because it looked at nothing. Nothing was uploaded."
            exit 1
          fi
          if [ "$extracted" -lt "$expected" ]; then
            echo "::error::CodeQL extracted $extracted of $expected Kotlin files. A compile task was skipped — a restored task output is the usual cause. Nothing was uploaded."
            exit 1
          fi

      - name: Upload the results
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
          category: /language:${{ matrix.language }}
