# Dependabot covers both ecosystems this repo has: the Gradle version catalog
# and the action pins in .github/workflows.
#
# The Gradle schedule is **daily**, which is unusual and deliberate.
#
# Corrected 2026-09-04: this comment used to justify the cadence by claiming that Android Lint
# runs with `warningsAsErrors = true` and that its dependency checks treat an available newer
# version as a finding, so an upstream release could turn `main` red on its own. That is no
# longer true — `GradleDependency` and `AndroidGradlePluginVersion` are both `disable`d in `:app`
# and in every `core:*` module, so nothing about a stale dependency reddens the build.
#
# The daily cadence stays, for the reason that actually applies now: this repo's dependency
# surface is where its worst realistic compromise lives (see supply-chain.yml), the app ships as a
# self-signed APK off GitHub Releases with no store review behind it, and a security advisory that
# lands on a Monday should not wait until the next Monday to be seen. It is hygiene — but hygiene
# on the shortest path an attacker has into the process that holds the refresh token.
#
# The claim above mattered beyond tidiness: while it stood, it made a reader believe Lint would
# force a version bump, which is exactly the assumption ADR-0019's advisory-floor pins depend on
# being false.
#
# No `labels:` on purpose: Dependabot creates and applies its own
# `dependencies` label, while a label named here that does not exist in the
# repo is silently dropped.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # AndroidX and Compose ship many artifacts on the same day; one PR per
      # artifact would bury the ones that matter.
      androidx:
        patterns:
          - "androidx.*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx:*"
    ignore:
      # The preinstrumented Robolectric runtime is NOT an ordinary dependency: its coordinate is
      # `<androidVersion>-robolectric-<buildId>-i<preinstrumentedVersion>`, and which one is
      # correct is decided by the `robolectric` version's own `DefaultSdkProvider` plus the SDK
      # level every `@Config(sdk = …)` in the repo pins. Dependabot can see none of that, so it
      # proposes the newest artifact on Maven and every Robolectric test fails.
      #
      # Measured 2026-08-21 on the proposal it opened (#45, closed): the Android 17 runtime needs
      # Robolectric >= 4.17 (4.16.1 answers `IllegalArgumentException: API level 37 is not
      # available`), and 4.17 exists only as a beta which cannot run on this toolchain at all --
      # all 350 tests died with `Failed to interact with raw FileDescriptor internals`.
      #
      # Bumping it is therefore a deliberate three-part change (runtime + `robolectric` + every
      # `@Config` pin), never an automated one. Revisit when 4.17 is stable; `docs/
      # ANDROID_APP_DEV_CI.md` § 4 carries the full rationale.
      - dependency-name: "org.robolectric:android-all-instrumented"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
