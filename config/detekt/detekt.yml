complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 30

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    excludes: ['**/theme/**']
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
