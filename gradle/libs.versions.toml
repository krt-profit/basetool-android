#
# Dependency version catalog — the single source of truth for versions.
# Baseline verified 2026-08-17 (see docs/ANDROID_APP_PLAN.md section 2).
#

[versions]
agp = "9.4.0"

# HELD BACK ONE RELEASE, ON PURPOSE — ADR-0022. Do NOT bump this to 2.4.20 or later without
# reading that ADR first; `main` was red for two days the last time it moved.
#
# CodeQL's Kotlin extractor hooks the Kotlin compiler, so the compiler version it can parse is a
# hard ceiling on the whole `java-kotlin` analysis. Every SHIPPED CodeQL bundle up to and including
# 2.27.0 (2026-09-09, the newest) caps that ceiling at Kotlin 2.4.0 — the extractor's own
# `java/kotlin-extractor/versions.bzl` in github/codeql tops out there. Building this repo at
# 2.4.20 therefore does not degrade the analysis, it aborts the Gradle build outright:
#
# And the pin bump is not a way out: the runner's toolcache already serves 2.27.0 regardless of the
# action's own default, so the red runs were ALREADY on the newest bundle (both 34744542737 and the
# green run that fixed it resolve /opt/hostedtoolcache/CodeQL/2.27.0/x64).
#
#     com.semmle.extractor.java.interceptors.KotlinInterceptor$KotlinVersionTooRecentError:
#     Kotlin version 2.4.20 is too recent. CodeQL currently supports versions below 2.4.20
#
# `Analyze (java-kotlin)` is a REQUIRED check, so that is not just a lost scan — it is every PR
# stuck at BLOCKED, on an app whose whole job is moving tokens and member data between a Keystore,
# a realm and an API.
#
# WHEN TO BUMP: support for 2.4.20 is already merged upstream (github/codeql commit 47cc7d81,
# "Kotlin: use 2.4.20 GA", 2026-09-07) but landed AFTER the 2.27.0 release branch was cut, so it
# ships in the next CodeQL release. Check the ceiling before bumping, do not guess:
#
#     gh api "repos/github/codeql/contents/java/kotlin-extractor/versions.bzl?ref=codeql-cli/vX.Y.Z"
#         -q .content | base64 -d
#
# When that list contains 2.4.20, bump `github/codeql-action` in `.github/workflows/codeql.yml` to
# a release carrying that bundle, then bump this line and drop the Dependabot ignore in
# `.github/dependabot.yml`. All three move together.
#
# Gradle pairing, checked rather than assumed: KGP 2.4.10 states a tested Gradle ceiling of 9.5.0
# and this wrapper is 9.7.1, which is the same two-minor gap this repo ran green on from
# 2026-08-24 (wrapper 9.7.1) to 2026-09-11 (the bump). Not a new risk; not a comfortable one
# either, and it is the other reason this is temporary.
kotlin = "2.4.10"

# SDK levels — owner decisions, see docs/ANDROID_APP_PLAN.md
compileSdk = "37"
minSdk = "31"
targetSdk = "37"

androidxCore = "1.19.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
composeBom = "2026.09.00"
# Adaptive layout + navigation are versioned outside the Compose BOM.
composeAdaptive = "1.3.0"
androidxNavigation = "2.10.1"

junit = "4.13.2"
robolectric = "4.17"
# The `android-all` runtime Robolectric loads for `@Config(sdk = [34])`, which every Robolectric
# test in this repo pins. Robolectric fetches this jar from Maven at TEST EXECUTION time — outside
# Gradle's dependency resolution and therefore outside CI's Gradle cache — so one bad HTTP request
# fails every Robolectric class at `classMethod` with a bare `MavenArtifactFetcher` AssertionError
# that reads exactly like a real regression. Declaring it here turns that runtime fetch into a
# resolved, cached, verifiable Gradle dependency; the root build script then runs the tests with
# `robolectric.offline=true`, so nothing reaches for the network mid-test.
#
# The coordinate is `<androidVersion>-robolectric-<buildId>-i<preinstrumentedVersion>`, and all
# three parts are hardcoded in Robolectric's own `DefaultSdkProvider` — so BUMPING `robolectric`
# ABOVE MEANS BUMPING THIS TOO (Dependabot cannot know that). When the two drift apart the offline
# resolver fails with `Unable to locate dependency: '<file>'`, and that file name is the value to
# put here. Adding a second `@Config(sdk = ...)` level means adding its artifact next to this one.
robolectricAndroidAll = "14-robolectric-10818077-i7"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"

okhttp = "5.5.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
androidxAppcompat = "1.8.0"
androidxBrowser = "1.10.0"
androidxDatastore = "1.2.1"
# 1.1.0 is the newest STABLE; everything after it is 1.2.0-alpha / 1.4.0-alpha. An alpha in the
# authentication path of a shipped app is a poor trade, and 1.1.0 already carries what the lock
# needs: canAuthenticate(int) and setAllowedAuthenticators(BIOMETRIC_STRONG or DEVICE_CREDENTIAL).
androidxBiometric = "1.1.0"
nimbusJose = "10.9.1"

licensee = "1.14.1"
openapiGenerator = "7.25.0"

detekt = "2.0.0-alpha.6"
spotless = "8.10.2"
ktlint = "1.8.0"

# Security floor for the BUILD-TIME transitives pinned from the root build script (ADR-0019).
# The three BouncyCastle artifacts share one version ref deliberately: they must move as a set, or a
# bumped bcpkix meets an old bcutil and the result is a NoSuchMethodError at APK-signing time. That
# coupling was exercised on 2026-09-04 and held — one Dependabot bump moved all three to 1.85.
# 2026-09-13: bcprov published a 1.85.2 point release but bcpkix/bcutil did not — Maven Central has
# no 1.85.2 for either, so pinning bouncycastle to 1.85.2 breaks buildscript classpath resolution
# with ModuleVersionNotFoundException. 1.86 is the newest version all three artifacts actually share.
bouncycastle = "1.86"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class" }
compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "composeAdaptive" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3-junit4", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "androidxBrowser" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidxBiometric" }
nimbus-jose-jwt = { group = "com.nimbusds", name = "nimbus-jose-jwt", version.ref = "nimbusJose" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
robolectric-android-all-instrumented = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "robolectricAndroidAll" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

# Build-time security pins — see ADR-0019.
#
# None of these is a dependency of the app. They are transitive artifacts of the Gradle plugins
# (AGP, licensee, openapi-generator) and of Robolectric, every one of them carrying an open
# advisory that Dependabot cannot propose a fix for: the coordinates are undeclared, so there is
# no version for it to bump, and no newer plugin release moves them. The root build script turns
# each entry below into a dependency *constraint*, which raises a resolution and never lowers one.
#
# They are advisory FLOORS rather than "always newest". A constraint only raises, so the day AGP or
# Robolectric ships something higher, the higher version wins instead of being held back — which is
# why a floor below the newest release is safe.
#
# ONE OF THESE IS NOT A CONSTRAINT. `pin-plexus-xml` is ADDED to the buildscript classpath rather
# than constrained, because it is not in the graph at all and a constraint on an absent module does
# nothing. plexus-utils 4.0.0 EXTRACTED `org.codehaus.plexus.util.xml.*` into that separate
# artifact, and Maven 3.9.x's maven-model — which app.cash.licensee pulls — still calls into it.
# Without it, raising plexus-utils to 4.x fails every Gradle invocation with
# `NoClassDefFoundError: org/codehaus/plexus/util/xml/pull/XmlPullParserException`. Measured
# 2026-09-04, first by breaking `main` and then by fixing it properly: with plexus-xml on the
# classpath, licensee's `artifacts.json` and the shipped `oss_licenses.json` are byte-identical to
# what 3.6.2 produced.
#
# `pin-bcutil` has no advisory of its own and exists solely to keep the BouncyCastle trio in step.
# Do not delete it as unused.
pin-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
pin-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
pin-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncycastle" }
pin-jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version = "0.9.7" }
pin-jdom2 = { group = "org.jdom", name = "jdom2", version = "2.0.6.1" }
pin-plexus-utils = { group = "org.codehaus.plexus", name = "plexus-utils", version = "4.1.0" }
pin-plexus-xml = { group = "org.codehaus.plexus", name = "plexus-xml", version = "4.2.0" }
pin-commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version = "3.20.0" }
pin-httpclient = { group = "org.apache.httpcomponents", name = "httpclient", version = "4.5.14" }
pin-httpmime = { group = "org.apache.httpcomponents", name = "httpmime", version = "4.5.14" }
pin-handlebars = { group = "com.github.jknack", name = "handlebars", version = "4.5.4" }

[plugins]
# AGP 9 compiles Kotlin itself — the org.jetbrains.kotlin.android plugin is gone
# (https://developer.android.com/build/migrate-to-built-in-kotlin). Only the Compose
# compiler plugin is still applied per module.
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }
